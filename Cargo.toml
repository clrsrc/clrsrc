[package]
name = "clrsrc"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A high-performance UCI chess engine with self-trained NNUE evaluation"

[lib]
name = "clrsrc"
path = "src/lib.rs"

[[bin]]
name = "clrsrc"
path = "src/main.rs"

[dependencies]
shakmaty = "0.27"
shakmaty-syzygy = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false

# `kani` ist nur unter dem Kani-Verifier gesetzt (Beweis-Harnesses in src/search.rs unter
# #[cfg(kani)]); hier als bekanntes cfg deklariert, damit der normale Build nicht warnt.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
