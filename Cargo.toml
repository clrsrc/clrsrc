[package]
name = "clrsrc"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A high-performance UCI chess engine with self-trained NNUE evaluation"

[dependencies]
shakmaty = "0.27"
shakmaty-syzygy = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false
